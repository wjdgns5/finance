plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.stockinsight'
version = '0.6.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

configurations {
    mockitoAgent
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.10.0'
    implementation 'org.flywaydb:flyway-core'
    runtimeOnly 'org.flywaydb:flyway-mysql'
    runtimeOnly 'com.mysql:mysql-connector-j'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    mockitoAgent('org.mockito:mockito-core') { transitive = false }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.add('-parameters')
}

tasks.named('test') {
    useJUnitPlatform()
    // Java 21에서 실행 중인 JVM에 동적으로 붙는 대신 시작할 때 테스트 에이전트를 등록합니다.
    jvmArgs "-javaagent:${configurations.mockitoAgent.asPath}"
    inputs.property('mysqlIntegrationUrl', providers.environmentVariable('MYSQL_IT_URL').orElse('disabled'))
    inputs.property('mysqlUpgradeUrl', providers.environmentVariable('MYSQL_IT_UPGRADE_URL').orElse('disabled'))
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}
